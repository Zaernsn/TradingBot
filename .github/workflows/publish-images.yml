name: Test and publish trading bot image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    name: backend tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: autonomous
            tests: >-
              tests/test_adaptive_strategy.py tests/test_autonomous.py
              tests/test_autonomous_api.py tests/test_fast_meme_policy.py
              tests/test_fast_momentum.py tests/test_memecoins.py
              tests/test_drift_recovery.py tests/test_forward_and_hints.py
          - group: execution
            tests: >-
              tests/test_account_overview.py tests/test_cash_reconciliation.py
              tests/test_execution_safety.py tests/test_kraken_order_requests.py
              tests/test_trading.py tests/test_preflight_errors.py
          - group: models
            tests: >-
              tests/test_features.py tests/test_models.py tests/test_research.py
              tests/test_signal_qualification.py tests/test_buy_threshold.py
          - group: api-and-storage
            tests: >-
              tests/test_auth.py tests/test_discovery_and_resend.py
              tests/test_exchange_service.py tests/test_market.py
              tests/test_migrations.py tests/test_settings.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -q --tb=short ${{ matrix.tests }}

  frontend-test:
    name: frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          node tracked-coins.test.cjs
          npm run build

  publish:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/trading-bot
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=trading-bot
          cache-to: type=gha,mode=max,scope=trading-bot
          provenance: mode=max
          sbom: true
